// ─── API helpers ─────────────────────────────────────────────────────────────
const api = async (path, opts = {}) => {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation",
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || res.statusText);
  }
  return res.status === 204 ? null : res.json().catch(() => null);
};

const hashPw = async (pw) => {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
};

const fieldHtml = (label, value) =>
  `<div class="field"><p class="field-label">${escapeHtml(label)}</p><p class="field-value${value?"":" empty"}">${value?escapeHtml(value):"(sin completar)"}</p></div>`;

// Lee (solo lectura, no modifica nada) las reflexiones que cada lección guardó
// en localStorage de este mismo navegador — mismo origen que app.html, así que
// es accesible directamente. Distintas lecciones se construyeron en momentos
// distintos con nombres de clave distintos (ej. "dia40_resp" vs
// "reflections:dia-12"), así que en vez de adivinar el nombre exacto, busca
// entre TODAS las claves guardadas cuál contiene el número de ese día.
const findLessonKeys = (label) => {
  if (!label) return [];
  const numbers = label.split("-"); // ej. "35-34" → ["35","34"]; "12" → ["12"]
  const candidates = [...numbers, numbers.join("")]; // + "3534" por si van pegados sin separador
  let allKeys = [];
  try { allKeys = Object.keys(window.localStorage); } catch(e) { return []; }
  return allKeys.filter(k => /dia/i.test(k) && candidates.some(n => new RegExp("(^|\\D)0*" + n + "(\\D|$)").test(k)));
};

// Junta cualquier texto de respuesta dentro del objeto guardado, sin importar
// cómo esté estructurado (plano, anidado, con o sin nombres de pregunta).
const flattenAnswers = (obj, out = []) => {
  if (obj == null) return out;
  if (typeof obj === "string") { if (obj.trim()) out.push(obj.trim()); return out; }
  if (typeof obj === "object") Object.keys(obj).forEach(k => flattenAnswers(obj[k], out));
  return out;
};

const lessonReflectionsHtml = (d) => {
  const label = LECCION_DIA[d];
  const keys = findLessonKeys(label);
  const answers = [];
  keys.forEach(key => {
    const raw = window.localStorage.getItem(key);
    if (!raw) return;
    try {
      flattenAnswers(JSON.parse(raw), answers);
    } catch(e) {
      if (raw.trim()) answers.push(raw.trim()); // no era JSON — era texto plano, lo tomamos tal cual
    }
  });
  if (!answers.length) return "";
  const parts = answers.map((a, i) => fieldHtml("Reflexión " + (i + 1), a));
  return `<div class="section-am" style="background:${C.goldLight};border-left-color:${C.gold};color:${C.goldDark};">📖 Reflexiones de la lección</div>${parts.join("")}`;
};

function AuthScreen({ onLogin, onAdminLogin }) {
  const [modo, setModo] = useState("login"); // login | registro
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [nombre, setNombre] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [successMsg, setSuccessMsg] = useState("");

  const login = async () => {
    setError(""); setLoading(true);
    try {
      if (email === "admin" && pw === ADMIN_CODE) { onAdminLogin(); return; }
      const hash = await hashPw(pw);
      const data = await api(`usuarios?email=eq.${encodeURIComponent(email)}&pw_hash=eq.${hash}&select=*`);
      if (!data || data.length === 0) { setError("Email o contraseña incorrectos."); setLoading(false); return; }
      const user = data[0];
      if (!user.active) {
        setError(user.start_date
          ? "Tu acceso fue desactivado. Contactá a María Laura."
          : "Tu cuenta fue creada y está pendiente de activación. María Laura te va a avisar cuando puedas ingresar.");
        setLoading(false); return;
      }
      onLogin(user);
    } catch(e) { setError("Error de conexión. Intentá de nuevo."); }
    setLoading(false);
  };

  const registro = async () => {
    setError(""); setSuccessMsg("");
    if (!nombre.trim()) { setError("Ingresá tu nombre."); return; }
    if (!email.trim() || !email.includes("@")) { setError("Email inválido."); return; }
    if (pw.length < 8) { setError("La contraseña debe tener al menos 8 caracteres."); return; }
    if (pw !== pw2) { setError("Las contraseñas no coinciden."); return; }
    setLoading(true);
    try {
      const existing = await api(`usuarios?email=eq.${encodeURIComponent(email)}&select=id`);
      if (existing && existing.length > 0) { setError("Ya existe una cuenta con ese email."); setLoading(false); return; }
      const hash = await hashPw(pw);
      await api("usuarios", {
        method: "POST",
        body: JSON.stringify({ nombre: nombre.trim(), email: email.trim().toLowerCase(), pw_hash: hash, active: false, start_date: null })
      });
      setNombre(""); setEmail(""); setPw(""); setPw2("");
      setSuccessMsg("¡Cuenta creada! María Laura va a activar tu acceso en breve — te va a avisar para que puedas ingresar.");
      setModo("login");
    } catch(e) { setError("Error al crear la cuenta. Intentá de nuevo."); }
    setLoading(false);
  };

          {[["login","Ingresar"],["registro","Registrarme"]].map(([m,l]) => (
            <button key={m} onClick={() => { setModo(m); setError(""); }}
              style={{ flex: 1, padding: "8px 0", background: modo === m ? C.plum : "transparent", color: modo === m ? "#fff" : C.carbon2, border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font-sans)", transition: "all 0.2s" }}>
              {l}
            </button>
          ))}
        </div>

        {modo === "login" ? (
          <>
            <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="tu@email.com" />
            <Input label="Contraseña" type="password" value={pw} onChange={setPw} placeholder="Tu contraseña" />
            {successMsg && <p style={{ color: C.gold, fontSize: 13, marginBottom: 10, fontFamily: "var(--font-sans)" }}>{successMsg}</p>}
            {error && <p style={{ color: C.error, fontSize: 13, marginBottom: 10, fontFamily: "var(--font-sans)" }}>{error}</p>}
            <Btn full onClick={login} loading={loading}>Ingresar</Btn>
          </>
        ) : (
          <>
            <Input label="Nombre completo" value={nombre} onChange={setNombre} placeholder="Tu nombre" />
            <Input label="Email" type="email" value={email} onChange={setEmail} placeholder="tu@email.com" />
            <Input label="Contraseña" type="password" value={pw} onChange={setPw} placeholder="Mínimo 8 caracteres" />
            <Input label="Repetir contraseña" type="password" value={pw2} onChange={setPw2} placeholder="Repetí tu contraseña" />
            {error && <p style={{ color: C.error, fontSize: 13, marginBottom: 10, fontFamily: "var(--font-sans)" }}>{error}</p>}
            <Btn full onClick={registro} loading={loading}>Crear mi cuenta</Btn>
          </>
        )}
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [page, setPage] = useState("inicio");
  const [selDay, setSelDay] = useState(null);
  const [nacimientos, setNacimientos] = useState(Array(7).fill(""));
  const [entries, setEntries] = useState({});
  const [saved, setSaved] = useState(false);
  const [loadingData, setLoadingData] = useState(false);

  // Cargar datos del usuario desde Supabase
  useEffect(() => {
    if (!user) return;
    const loadData = async () => {
      setLoadingData(true);
      try {
        const [nac, ents] = await Promise.all([
          api(`nacimientos?user_id=eq.${user.id}&select=*`),
          api(`entradas?user_id=eq.${user.id}&select=*`)
        ]);
        if (nac && nac.length > 0) setNacimientos(nac[0].items || Array(7).fill(""));
        if (ents) {
          const map = {};
          ents.forEach(e => { map[e.dia] = e.data; });
          setEntries(map);
        }
      } catch(e) { console.error(e); }
      setLoadingData(false);
    };
    loadData();
  }, [user]);

  const todayNum = user?.start_date
    ? Math.min(40, Math.max(1, Math.floor((Date.now() - new Date(user.start_date)) / 86400000) + 1))
    : 1;

  const countdown = d => 41 - d;
  const getEntry = d => entries[d] || {};
  const isComplete = d => { const e = getEntry(d); return !!(e.titulo || e.sucesos || e.gratitud); };

  const saveNacimientos = async (arr) => {
    setNacimientos(arr);
    try {
      const existing = await api(`nacimientos?user_id=eq.${user.id}&select=id`);
      if (existing && existing.length > 0) {
        await api(`nacimientos?user_id=eq.${user.id}`, { method: "PATCH", body: JSON.stringify({ items: arr }) });
      } else {
        await api("nacimientos", { method: "POST", body: JSON.stringify({ user_id: user.id, items: arr }) });
      }
    } catch(e) { console.error(e); }
  };

  const saveEntry = async (d, data) => {
    const updated = { ...entries, [d]: data };
    setEntries(updated);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
    try {
      const existing = await api(`entradas?user_id=eq.${user.id}&dia=eq.${d}&select=id`);
      if (existing && existing.length > 0) {
        await api(`entradas?user_id=eq.${user.id}&dia=eq.${d}`, { method: "PATCH", body: JSON.stringify({ data }) });
      } else {
        await api("entradas", { method: "POST", body: JSON.stringify({ user_id: user.id, dia: d, data }) });
      }
    } catch(e) { console.error(e); }
  };

  const setField = (d, f, v) => {
    const updated = { ...getEntry(d), [f]: v };
    setEntries({ ...entries, [d]: updated });
  };

  const nacimientosBlockHtml = () => nacimientos.filter(Boolean).length
    ? `<div class="field"><p class="field-label">Nacimientos a...</p><p class="field-value">${nacimientos.filter(Boolean).map((n,i)=>escapeHtml((i+1)+". "+n)).join("<br/>")}</p></div><hr class="divider"/>`
    : "";

  const dayBlockHtml = (d, e) => {
    const cd = countdown(d);
    return `
    <div class="day">
      <div class="day-badge">Día ${cd} de la cuenta atrás (Día ${d}/40)</div>
      ${lessonReflectionsHtml(d)}
      <div class="section-am">☀️ Mañana</div>
      ${fieldHtml("Título del día", e.titulo)}
      ${fieldHtml("Decretos positivos", e.decretos)}
      ${fieldHtml("Agenda evolutiva del día", e.agenda)}
      <div class="section-pm">🌙 Noche</div>
      ${fieldHtml("Sucesos mágicos, especiales o significativos", e.sucesos)}
      ${fieldHtml("¿Qué me trajo de positivo lo negativo?", e.negativo)}
      ${fieldHtml("¿A quién o a qué he beneficiado hoy?", e.beneficio)}
      ${fieldHtml("¿De qué he gozado hoy?", e.gozo)}
      ${fieldHtml("¿En qué he progresado hoy?", e.progreso)}
      ${fieldHtml("Programación del sueño", e.sueno)}
      ${fieldHtml("Agradecimiento del día", e.gratitud)}
    </div>`;
  };

  const buildDocHtml = (title, subtitle, dayEntries) => `<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><title>${escapeHtml(title)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>${DOC_STYLES}</style></head><body><div class="doc">
<div class="cover"><p class="eyebrow">L'Aura · Diario del Psiconauta</p><h1>${escapeHtml(title)}</h1><p class="meta">${escapeHtml(subtitle)}</p></div>
${nacimientosBlockHtml()}
${dayEntries.map(({d,e}) => dayBlockHtml(d,e) + '<hr class="divider"/>').join("")}
<p class="footer">Basado en el método de José María Doria · Escuela Española de Desarrollo Transpersonal (EDT)<br/>— Documento privado —</p>
</div></body></html>`;

  const downloadDay = d => {
    const e = getEntry(d);
    const cd = countdown(d);
    const html = buildDocHtml("Diario del día " + cd, "Día " + cd + " de la cuenta atrás (Día " + d + "/40) · " + user.nombre, [{ d, e }]);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    a.download = "diario_dia" + cd + ".html"; a.click();
  };

  const downloadFullNotebook = () => {
    const allDays = Array.from({length:40},(_,i)=>i+1);
    const completedCount = allDays.filter(isComplete).length;
    const html = buildDocHtml("Cuaderno completo", completedCount + "/40 días completados · " + user.nombre, allDays.map(d => ({ d, e: getEntry(d) })));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    a.download = "cuaderno_completo_" + user.nombre.replace(/\s+/g,"_") + ".html";
    a.click();
  };

  if (!user && !isAdmin) return (
    <AuthScreen
      onLogin={u => setUser(u)}
      onAdminLogin={() => setIsAdmin(true)}
    />
  );

  if (isAdmin) return <AdminPanel onLogout={() => setIsAdmin(false)} />;

  // Vista diario de un día
  if (selDay) {

    const cd = countdown(d);
    const e = getEntry(d);
    const leccionKey = LECCION_DIA[d];

    return (
      <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "Georgia,serif" }}>
        <div style={{ background: "linear-gradient(160deg,"+C.plumDark+" 0%,"+C.plum+" 100%)", padding: "1rem 1.5rem", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div>
            <p style={{ fontSize: 11, color: "#C9B8E0", margin: "0 0 2px", fontFamily: "var(--font-sans)", textTransform: "uppercase", letterSpacing: 1 }}>Día {cd} de la cuenta atrás</p>
            <p style={{ fontSize: 15, color: "#fff", margin: 0, fontFamily: "Georgia,serif" }}>{user.nombre}</p>
          </div>
          <button onClick={() => setSelDay(null)} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", padding: "8px 16px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontFamily: "var(--font-sans)" }}>← Calendario</button>
        </div>

        <div style={{ padding: "1.5rem", maxWidth: 660, margin: "0 auto" }}>
          {/* Botón lección */}
          <button onClick={() => DRIVE_LINKS[d] && window.open(DRIVE_LINKS[d], "_blank")}
            style={{ width: "100%", padding: "18px 20px", background: DRIVE_LINKS[d] ? "linear-gradient(160deg,"+C.gold+" 0%,"+C.goldDark+" 100%)" : C.bgCard, border: DRIVE_LINKS[d] ? "none" : "1.5px solid "+C.border, borderRadius: 14, cursor: DRIVE_LINKS[d] ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, boxShadow: DRIVE_LINKS[d] ? "0 4px 14px rgba(166,124,82,0.35)" : "none" }}>
            <div style={{ textAlign: "left" }}>
              <p style={{ fontSize: 12, fontFamily: "var(--font-sans)", fontWeight: 700, color: DRIVE_LINKS[d] ? "#fff" : C.carbon2, margin: "0 0 3px", textTransform: "uppercase", letterSpacing: 1.2, opacity: DRIVE_LINKS[d] ? 0.85 : 1 }}>
                {DRIVE_LINKS[d] ? "Lección del día" : "🔜 Lección próximamente"}
              </p>
              <p style={{ fontSize: 18, color: DRIVE_LINKS[d] ? "#fff" : C.carbon2, margin: "0 0 3px", fontFamily: "Georgia,serif", fontWeight: 700 }}>
                {typeof leccionKey === "string" ? "Días "+leccionKey : "Día "+leccionKey}
              </p>
              <p style={{ fontSize: 12, color: DRIVE_LINKS[d] ? "rgba(255,255,255,0.85)" : C.carbon2, margin: 0, fontFamily: "var(--font-sans)" }}>
                Tocá para leerla · Se abre en nueva pestaña
              </p>
            </div>
            <span style={{ fontSize: 30 }}>📖</span>
          </button>

          {/* MAÑANA */}
          <div style={{ background: C.plumLight, borderRadius: 10, padding: "10px 14px", marginBottom: 14, borderLeft: "3px solid "+C.plum }}>
            <p style={{ fontWeight: 600, fontSize: 14, color: C.plumDark, margin: 0, fontFamily: "var(--font-sans)" }}>☀️ MAÑANA — Día {cd} de la cuenta atrás</p>
          </div>

          <Section title="1° Nacimiento a..." color={C.plum}>
            {nacimientos.filter(Boolean).length > 0
              ? nacimientos.filter(Boolean).map((n,i) => (

                  <span style={{ fontWeight: 600, fontFamily: "var(--font-sans)" }}>{i+1}.</span> {n}
                </div>
              ))
              : <p style={{ fontSize: 13, color: C.carbon2, fontStyle: "italic", fontFamily: "var(--font-sans)" }}>Cargá tus nacimientos en la pestaña "Nacimientos".</p>
            }
          </Section>

          <Section title="2° Título del día" color={C.plum}>
            <input value={e.titulo||""} onChange={ev => setField(d,"titulo",ev.target.value)}
              placeholder='"La puerta se abre", "La sincronía del camino"...'
              style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "0.5px solid "+C.border, background: C.bg, color: C.carbon, fontSize: 15, fontStyle: "italic", fontFamily: "Georgia,serif", outline: "none", boxSizing: "border-box" }} />
          </Section>

          <Section title="3° Decretos positivos" color={C.plum}>
            <Field hint="Mínimo 3 frases afirmativas. En positivo, presente, primera persona."
              value={e.decretos||""} onChange={v => setField(d,"decretos",v)} rows={4}
              placeholder={"Me siento serena y confiada hoy.\nEscucho con amor y comprensión.\nLa energía vital fluye por mí."} />
          </Section>

          <Section title="4° Agenda evolutiva del día" color={C.plum}>
            <Field hint="Acciones del día relacionadas con tu crecimiento interior."
              value={e.agenda||""} onChange={v => setField(d,"agenda",v)} rows={3}
              placeholder="¿Qué acción de crecimiento me propongo hacer hoy?" />
          </Section>

          {/* NOCHE */}
          <div style={{ background: C.nightLight, borderRadius: 10, padding: "10px 14px", margin: "20px 0 14px", borderLeft: "3px solid "+C.night }}>
            <p style={{ fontWeight: 600, fontSize: 14, color: C.night, margin: 0, fontFamily: "var(--font-sans)" }}>🌙 NOCHE — Cierre del día {cd}</p>
          </div>

          {[
            { key:"sucesos", num:"1°", title:"Sucesos mágicos, especiales o significativos", hint:"Recorré el día hora a hora.", ph:"¿Qué aconteció hoy que resonó con tu ser?" },
            { key:"negativo", num:"2°", title:"¿Qué me trajo de positivo lo negativo?", hint:"¿Qué te enseñó aquello que no ocurrió como querías?", ph:'"El destino escribe recto con líneas torcidas"...' },
            { key:"beneficio", num:"3°", title:"¿A quién o a qué he beneficiado hoy?", hint:"El supremo gozo de ser útil.", ph:"¿A quién le diste algo hoy?" },
            { key:"gozo", num:"4°", title:"¿De qué he gozado hoy?", hint:"Restableció el contacto con tus áreas de alegría.", ph:"¿Qué momentos te dieron satisfacción?" },
            { key:"progreso", num:"5°", title:"¿En qué he progresado hoy?", hint:"Lo importante es la tendencia.", ph:"¿Qué pequeño avance reconocés hoy?" },
          ].map(item => (
            <Section key={item.key} title={item.num+" "+item.title} color={C.night}>
              <Field hint={item.hint} value={e[item.key]||""} onChange={v => setField(d,item.key,v)} rows={3} placeholder={item.ph} />
            </Section>
          ))}

          <Section title="6° Programación del sueño" color={C.night}>
            <Field label='"Decreto a mi mente que durante el sueño me ABRA A..."'
              value={e.sueno||""} onChange={v => setField(d,"sueno",v)} rows={2}
              placeholder="Decreto a mi mente que durante el sueño me abra a..." />
          </Section>

          <Section title="7° Agradecimiento del día" color={C.night}>
            <Field hint="¡¡¡ Gracias al Universo por el día de hoy !!!"
              value={e.gratitud||""} onChange={v => setField(d,"gratitud",v)} rows={3}
              placeholder="¿Qué agradecés de este día?" />
          </Section>

          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={() => saveEntry(d, getEntry(d))}
              style={{ flex: 2, padding: "12px 0", background: C.plum, color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "var(--font-sans)" }}>
              {saved ? "✓ Guardado en la nube" : "Guardar"}
            </button>
            <button onClick={() => downloadDay(d)}
              style={{ flex: 1, padding: "12px 0", background: C.bgCard, color: C.carbon, border: "1px solid "+C.border, borderRadius: 10, fontSize: 13, cursor: "pointer", fontFamily: "var(--font-sans)" }}>
              Descargar 📄
            </button>
          </div>
        </div>
      </div>
    );
  }

  const tabs = [
    { id: "inicio", icon: "🏠", label: "Inicio" },
    { id: "nacimientos", icon: "🌱", label: "Nacimientos" },
    { id: "calendario", icon: "🗓", label: "Calendario" },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "Georgia,serif" }}>
      <div style={{ background: "linear-gradient(160deg,"+C.plumDark+" 0%,"+C.plum+" 100%)", padding: "1rem 1.5rem", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <span style={{ fontFamily: "Georgia,serif", fontSize: 15, color: "#fff", letterSpacing: 1 }}>40 Días de Atención Sostenida</span>
          <span style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", marginLeft: 10, fontFamily: "var(--font-sans)" }}>Día {todayNum}/40 · {user.nombre}</span>
        </div>
        <button onClick={() => setUser(null)} style={{ fontSize: 12, color: "rgba(255,255,255,0.6)", background: "none", border: "none", cursor: "pointer", fontFamily: "var(--font-sans)" }}>Salir</button>
      </div>

      <div style={{ display: "flex", gap: 8, padding: "10px 12px", background: C.bgCard, borderBottom: "0.5px solid "+C.border }}>

            <span style={{ fontSize: 22 }}>{t.icon}</span>
            <span style={{ fontSize: 13, fontWeight: 700 }}>{t.label}</span>
          </button>

      </div>

      <div style={{ padding: "1.5rem", maxWidth: 660, margin: "0 auto" }}>

        {page === "inicio" && (

            <button onClick={() => window.open(INSTRUCCIONES_LINK, "_blank")}
              style={{ width: "100%", padding: "16px 18px", marginBottom: "1.25rem", background: "linear-gradient(160deg,"+C.plumDark+" 0%,"+C.plum+" 100%)", border: "none", borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 12, boxShadow: "0 4px 14px rgba(92,61,122,0.3)" }}>
              <span style={{ fontSize: 28 }}>📘</span>
              <div style={{ textAlign: "left" }}>
                <p style={{ fontSize: 15, fontWeight: 700, color: "#fff", margin: "0 0 2px", fontFamily: "var(--font-sans)" }}>Presentación del proceso</p>
                <p style={{ fontSize: 12, color: "rgba(255,255,255,0.8)", margin: 0, fontFamily: "var(--font-sans)" }}>Leé esto antes de empezar · Se abre en nueva pestaña</p>
              </div>
            </button>
            <p style={{ fontFamily: "Georgia,serif", fontSize: 17, color: C.plumDark, fontStyle: "italic", margin: "0 0 6px" }}>Bienvenida, {user.nombre}</p>
            <p style={{ fontSize: 14, color: C.carbon2, lineHeight: 1.8, marginBottom: "1.5rem", fontFamily: "var(--font-sans)" }}>
              Este es tu espacio sagrado y privado de reconexión. Tu diario se guarda en la nube — podés acceder desde cualquier dispositivo.
            </p>
            <div style={{ background: C.bgCard, borderRadius: 12, padding: "1.25rem", marginBottom: 16, border: "0.5px solid "+C.border }}>
              <p style={{ fontFamily: "var(--font-sans)", fontWeight: 700, fontSize: 13, color: C.plum, marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>¿Qué es este proceso?</p>
              <p style={{ fontSize: 15, lineHeight: 1.9, color: C.carbon, margin: 0 }}>

              </p>
            </div>
            <div style={{ background: C.goldLight, borderRadius: 12, padding: "1.25rem", marginBottom: 16, borderLeft: "3px solid "+C.gold }}>
              <p style={{ fontFamily: "var(--font-sans)", fontWeight: 700, fontSize: 13, color: C.gold, marginBottom: 10, textTransform: "uppercase", letterSpacing: 1 }}>Cada día tiene</p>

                { l: "Día actual", v: todayNum, c: C.plum, bg: C.plumLight },

            <p style={{ fontSize: 13, color: C.carbon2, lineHeight: 1.8, marginBottom: 12, fontFamily: "var(--font-sans)" }}>

            <p style={{ fontSize: 12, color: C.carbon2, fontStyle: "italic", marginBottom: 16, fontFamily: "var(--font-sans)" }}>Ej: "Nacimiento a una vida en la que siento confianza y serenidad"</p>
            {nacimientos.map((n, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <span style={{ background: C.plum, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, flexShrink: 0, fontFamily: "var(--font-sans)", fontWeight: 700 }}>{i+1}</span>
                <input value={n} onChange={e => { const arr=[...nacimientos]; arr[i]=e.target.value; saveNacimientos(arr); }}
                  placeholder="Nacimiento a..."
                  style={{ flex: 1, padding: "8px 12px", borderRadius: 8, border: "0.5px solid "+(n?C.plum:C.border), background: C.bg, color: C.carbon, fontSize: 14, fontFamily: "Georgia,serif", outline: "none" }} />
              </div>
            ))}
            <p style={{ fontSize: 11, color: C.carbon2, marginTop: 10, fontFamily: "var(--font-sans)" }}>Se guardan automáticamente en la nube · Máximo 7</p>
          </div>
        )}

        {page === "calendario" && (
          <div>
            <p style={{ fontSize: 14, color: C.carbon2, lineHeight: 1.8, marginBottom: "1rem", fontFamily: "var(--font-sans)" }}>
              Tocá un día disponible para ver la lección y completar tu diario.
            </p>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: "1.5rem" }}>
              {Array.from({length:40},(_,i)=>i+1).map(d => {
                const cd = countdown(d);
                const avail = d <= todayNum;
                const done = isComplete(d);
                const esPar = typeof LECCION_DIA[d] === "string" && LECCION_DIA[d].includes("-");
                return (
                  <div key={d} onClick={() => avail && setSelDay(d)}
                    style={{ width: 58, borderRadius: 10, padding: "8px 4px", textAlign: "center", cursor: avail?"pointer":"default", background: done?C.plum:avail?C.plumLight:C.bgCard, border: "0.5px solid "+(avail?C.plum:C.border), opacity: avail?1:0.35, transition: "all 0.1s" }}>
                    <div style={{ fontSize: 10, color: done?"#C9B8E0":C.carbon2, fontFamily: "var(--font-sans)" }}>Día {cd}↓</div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: done?"#fff":avail?C.plumDark:C.carbon2, fontFamily: "var(--font-sans)" }}>{d}</div>
                    {esPar && <div style={{ fontSize: 9, color: done?"#C9B8E0":C.gold, fontFamily: "var(--font-sans)" }}>par</div>}
                    {done && <div style={{ fontSize: 10, color: "#fff" }}>✓</div>}
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", fontSize: 12, color: C.carbon2, fontFamily: "var(--font-sans)" }}>
              <span><span style={{ background: C.plum, color: "#fff", padding: "2px 8px", borderRadius: 4 }}>■</span> Completado</span>
              <span><span style={{ background: C.plumLight, padding: "2px 8px", borderRadius: 4 }}>■</span> Disponible</span>
              <span><span style={{ background: C.bgCard, padding: "2px 8px", borderRadius: 4, border: "0.5px solid "+C.border }}>■</span> Bloqueado</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
